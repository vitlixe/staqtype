name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  # Builds the release assets and installs each one the way the README says.
  install-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t ghcr.io/${{ github.repository }}:ci .

      - name: Run it with the release compose.yaml
        run: STAQTYPE_VERSION=ci docker compose up -d

      - name: Wait until the container is healthy
        run: |
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q staqtype)")
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test the container
        run: |
          set -eux
          curl -fsS http://localhost:8080/ | grep -q '<title>staqtype</title>'
          curl -fsS http://localhost:8080/settings | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/manifest.webmanifest | grep -q '"name": "staqtype"'
          test "$(curl -fsS http://localhost:8080/VERSION)" = "$(cat VERSION)"
          test "$(docker compose exec -T staqtype id -u)" != 0

      - name: Pack the static site
        run: |
          id=$(docker create ghcr.io/${{ github.repository }}:ci)
          mkdir -p release/staqtype
          docker cp "$id":/usr/share/nginx/html/. release/staqtype/
          docker rm "$id"
          tar -C release -czf staqtype.tar.gz staqtype

      - name: Serve the archive with stock nginx
        run: |
          set -eux
          mkdir site && tar -xzf staqtype.tar.gz -C site
          docker run -d --name archive -p 8091:8080 \
            -v "$PWD/site/staqtype:/usr/share/nginx/html:ro" \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine
          for _ in $(seq 15); do curl -fsS http://localhost:8091/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8091/ | grep -q '<title>staqtype</title>'
          test "$(curl -fsS http://localhost:8091/VERSION)" = "$(cat VERSION)"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            staqtype.tar.gz
            compose.yaml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: assets

      - name: Checksums
        working-directory: assets
        run: sha256sum staqtype.tar.gz compose.yaml > checksums.sha256

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Changelog"
            echo
            git log --no-merges --format='%H %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME" \
              | grep -vE '^[0-9a-f]+ (docs|test|ci): ' \
              | sort -k2 \
              | sed 's/^/* /'
          } > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
